# Copie para /etc/nginx/sites-available/employee_truck_control na VPS,
# depois: ln -s /etc/nginx/sites-available/employee_truck_control /etc/nginx/sites-enabled/
# Ajuste server_name e os caminhos para onde o repo for clonado.
server {
    listen 80;
    server_name expomarcas.cloud www.expomarcas.cloud;

    # 200M covers photo/document uploads (small) and kiosk installer .exe
    # uploads via /biometric/kiosk-installer/ (currently ~55M, room to grow).
    client_max_body_size 200M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/deploy/app/staticfiles/;
    }

    # /media/ is intentionally NOT served directly here — photos and ID
    # documents require login (LGPD), enforced by Django's
    # ProtectedMediaView. Requests to /media/... fall through to the
    # proxy_pass below; Django then hands the actual byte-serving back to
    # nginx via X-Accel-Redirect into this internal-only location.
    location /protected-media/ {
        internal;
        alias /home/deploy/app/media/;
    }

    location / {
        proxy_pass http://unix:/home/deploy/app/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
