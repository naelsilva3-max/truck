# Copie para /etc/nginx/sites-available/employee_truck_control na VPS,
# depois: ln -s /etc/nginx/sites-available/employee_truck_control /etc/nginx/sites-enabled/
# Ajuste server_name e os caminhos para onde o repo for clonado.
server {
    listen 80;
    server_name expomarcas.cloud www.expomarcas.cloud;

    client_max_body_size 20M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/deploy/app/staticfiles/;
    }

    location /media/ {
        alias /home/deploy/app/media/;
    }

    location / {
        proxy_pass http://unix:/home/deploy/app/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
