{% extends "base.html" %}
{% block title %}Histórico do Sistema{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Histórico do Sistema</h1>
  <small class="text-muted">Registro imutável</small>
</div>

<div class="card">
  <form method="get" class="filter-row">
    <div class="form-group">
      <label class="form-label">Ação</label>
      <select name="action" class="form-control">
        <option value="">Todas</option>
        <option value="login"    {% if request.GET.action == 'login'    %}selected{% endif %}>Login</option>
        <option value="logout"   {% if request.GET.action == 'logout'   %}selected{% endif %}>Logout</option>
        <option value="create"   {% if request.GET.action == 'create'   %}selected{% endif %}>Criação</option>
        <option value="update"   {% if request.GET.action == 'update'   %}selected{% endif %}>Atualização</option>
        <option value="delete"   {% if request.GET.action == 'delete'   %}selected{% endif %}>Exclusão</option>
        <option value="pdf"      {% if request.GET.action == 'pdf'      %}selected{% endif %}>PDF</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Usuário</label>
      <input type="text" name="user" class="form-control" placeholder="Nome do usuário" value="{{ request.GET.user }}">
    </div>
    <div class="form-group">
      <label class="form-label">De</label>
      <input type="date" name="start_date" class="form-control" value="{{ request.GET.start_date }}">
    </div>
    <div class="form-group">
      <label class="form-label">Até</label>
      <input type="date" name="end_date" class="form-control" value="{{ request.GET.end_date }}">
    </div>
    <div class="form-group align-self-end">
      <button type="submit" class="btn btn--primary">Filtrar</button>
      <a href="{% url 'accounts:system_logs' %}" class="btn btn--secondary">Limpar</a>
    </div>
  </form>
</div>

<div class="table-responsive">
  <table class="table">
    <thead>
      <tr>
        <th>Data/Hora</th>
        <th>Usuário</th>
        <th>Ação</th>
        <th>Descrição</th>
      </tr>
    </thead>
    {% include 'partials/_infinite_scroll_body.html' with rows_template='accounts/_log_rows.html' %}

<script>
window.startLivePoll({
  tbodyId: 'infinite-tbody',
  url: '{% url "accounts:system_logs" %}?{% if request.GET.action %}action={{ request.GET.action }}&{% endif %}{% if request.GET.user %}user={{ request.GET.user|urlencode }}&{% endif %}{% if request.GET.start_date %}start_date={{ request.GET.start_date }}&{% endif %}{% if request.GET.end_date %}end_date={{ request.GET.end_date }}{% endif %}'
});
</script>
{% endblock %}
