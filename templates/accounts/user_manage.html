{% extends "base.html" %}
{% block title %}Gerenciar Usuários{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Gerenciar Usuários</h1>
  <a href="{% url 'accounts:create_user' %}" class="btn btn--primary">Novo Usuário</a>
</div>
<div class="table-responsive">
  <table class="table">
    <thead>
      <tr>
        <th>Usuário</th>
        <th>Email</th>
        <th>CPF</th>
        <th>Nível</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="infinite-tbody">
      {% include 'accounts/_user_rows.html' %}
    </tbody>
  </table>
</div>

<script>
window.startLivePoll({
  tbodyId: 'infinite-tbody',
  url: '{% url "accounts:manage_users" %}'
});
window.startLiveUpdate({
  tbodyId: 'infinite-tbody',
  url: '{% url "accounts:manage_users" %}'
});
</script>
{% endblock %}
