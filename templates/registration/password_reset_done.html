{% extends "base.html" %}

{% block title %}Recuperar Senha{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <h1 class="login-title">Verifique seu Email</h1>
    <p class="text-muted">
      Se o email informado estiver cadastrado, enviamos um link para redefinição de senha.
      Verifique sua caixa de entrada (e o spam).
    </p>
    <p style="margin-top:1rem;"><a href="{% url 'login' %}">← Voltar ao login</a></p>
  </div>
</div>
{% endblock %}
