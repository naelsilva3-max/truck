{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1>{{ title }}</h1>
  <a href="{% url 'documentation_index' %}" class="btn btn--secondary">← Documentação</a>
</div>

<div class="docs-layout">
  <nav class="docs-nav">
    {% for group in nav %}
    <div class="docs-nav-section">
      <h3>{{ group.label }}</h3>
      <ul>
        {% for entry in group.entries %}
        <li>
          <a href="{{ entry.url }}"{% if group.section == section and entry.page == current_page %} class="active"{% endif %}>
            {{ entry.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </nav>

  <div class="card docs-content">
    {{ content_html|safe }}
  </div>
</div>
{% endblock %}
