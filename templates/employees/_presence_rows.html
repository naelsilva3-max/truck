{% for event in events %}
<tr data-timestamp="{{ event.timestamp|date:'c' }}">
  <td><a href="{% url 'employees:detail' event.employee.pk %}">{{ event.employee.name }}</a></td>
  <td>{{ event.timestamp|date:"d/m/Y H:i:s" }}</td>
  <td>
    {% if event.is_lunch %}
      {% if event.direction == 'IN' %}
        <span class="badge badge--warning">Retorno Almoço</span>
      {% else %}
        <span class="badge badge--warning">Saída Almoço</span>
      {% endif %}
    {% elif event.direction == 'IN' %}
      <span class="badge badge--success">Entrada</span>
    {% else %}
      <span class="badge badge--danger">Saída</span>
    {% endif %}
  </td>
</tr>
{% endfor %}
